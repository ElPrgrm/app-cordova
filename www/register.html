<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background:#f8fafc; }
        .card { width: min(480px, 98%); border-radius: 1rem; box-shadow: 0 24px 60px rgba(15,23,42,0.12); }
    </style>
</head>
<body>
    <main class="container py-4">
        <div class="card p-4">
            <div class="text-center mb-3">
                <div class="brand-icon mb-2" style="width:48px;height:48px;border-radius:50%;background:#0d6efd;color:#fff;display:inline-flex;align-items:center;justify-content:center">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="h5 mt-2">Crear cuenta</h1>
                <p class="text-muted">Registra un usuario para acceder a la aplicación.</p>
            </div>

            <div id="registerAlert" class="alert d-none" role="alert"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="regUsername" class="form-label">Usuario</label>
                    <input id="regUsername" name="username" type="text" class="form-control" required placeholder="Nombre de usuario">
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label">Contraseña</label>
                    <input id="regPassword" name="password" type="password" class="form-control" required placeholder="Contraseña">
                </div>
                <div class="mb-3">
                    <label for="regConfirm" class="form-label">Confirmar contraseña</label>
                    <input id="regConfirm" name="confirm" type="password" class="form-control" required placeholder="Repite la contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html">Volver a iniciar sesión</a>
            </div>
        </div>
    </main>

    <script src="js/register.js"></script>
</body>
</html>
