<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
       <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; connect-src 'self' https://dictionaries-measurement-powers-lisa.trycloudflare.com; style-src 'self' 'unsafe-inline'; media-src *;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/escaner.css">
        <title>Escanner</title>
    </head>
    <body>
        <div class="app" style="display: none;">
            <h1>Apache Cordova</h1>
            <div id="deviceready" class="blink">
                <p class="event listening">Connecting to Device</p>
                <p class="event received">Device is Ready</p>
            </div>
        </div>



       

    <div class="panel-control">
        <h3>Módulo de Captura</h3>
        <button id="btn-disparar-escaner" class="btn-primario">
            <svg class="icono" viewBox="0 0 24 24"><path d="M4 4h3V2H4c-1.1 0-2 .9-2 2v3h2V4zm16-2h-3v2h3v3h2V4c0-1.1-.9-2-2-2zm2 16h-2v3h-3v2h4c1.1 0 2-.9 2-2v-4zM4 17H2v4c0 1.1.9 2 2 2h3v-2H4v-3zm16-7V4H4v16h16v-6h-2v4H6V6h12v4h2z"/></svg>
            <span class="texto-boton">Iniciar Escaneo de Código</span>
        </button>
    </div>

    <div class="seccion-crud">
        <div class="formulario-mock">
            <h4> Registro (Create)</h4>
            <div class="grupo-input">
                <input type="text" id="input-codigo-manual" placeholder="Código de barras manual">
                <button id="btn-guardar-codigo">Guardar</button>
            </div>
        </div>

        <div class="historial-escaneos">
            <h4>Códigos Registrados </h4>
            <ul id="lista-codigos" class="lista-datos">
                </ul>
        </div>
    </div>
</div>
        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
        <script src="escaner.js"></script>
    </body>
</html>
