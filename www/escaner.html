<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; connect-src 'self'; style-src 'self'; media-src *;">

    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">

    <link rel="stylesheet" href="css/escaner.css">

    <title>Escáner</title>
</head>

<body>

    <main class="modulo-escaner">

        <section class="panel-control">
            <h3>Módulo de Captura</h3>

            <div class="acciones-panel">
                <a href="form.html" class="btn-secundario">Añadir producto</a>

                <button id="btn-disparar-escaner" class="btn-primario">
                    <svg class="icono" viewBox="0 0 24 24">
                        <path
                            d="M4 4h3V2H4c-1.1 0-2 .9-2 2v3h2V4zm16-2h-3v2h3v3h2V4c0-1.1-.9-2-2-2zm2 16h-2v3h-3v2h4c1.1 0 2-.9 2-2v-4zM4 17H2v4c0 1.1.9 2 2 2h3v-2H4v-3zm16-7V4H4v16h16v-6h-2v4H6V6h12v4h2z" />
                    </svg>
                    <span class="texto-boton">Escanear</span>
                </button>
            </div>
        </section>

        <section class="seccion-crud">

            <div class="formulario-mock">
                <h4>Captura manual</h4>

                <div class="grupo-input">
                    <input type="text" id="input-codigo-manual" placeholder="Código de barras manual">
                    <button id="btn-guardar-codigo">Guardar</button>
                </div>

                <p id="mensaje-sistema" class="mensaje-sistema"></p>
            </div>

            <div class="historial-escaneos">
                <h4>Códigos escaneados</h4>

                <ul id="lista-codigos" class="lista-datos"></ul>
            </div>

        </section>

        <section class="contenedor-tabla">
            <h4>Inventario</h4>

            <table class="inventario">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>

                <tbody id="tabla-inventario">
                </tbody>
            </table>
        </section>

    </main>
<br>
<a href="index.html" class="btn-secundario">Volver al menú</a>
    <script src="cordova.js"></script>
    <script src="js/escaner.js"></script>

</body>

</html>
