<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>POS Tablet | Sistema de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/ventas.css">
</head>

<body>
    <main class="app-shell">
        <div class="panel">
            <div class="panel-row row g-0">
                <!-- COLUMNA CARRITO (IZQUIERDA) -->
                <div class="side-left col-12 col-xl-4 col-lg-5">
                    <div class="header-cart">
                        <div class="brand">
                            <i class="fas fa-store me-2"></i>
                            <strong>Ventas</strong>
                            <small>Administrador</small>
                        </div>
                        <div class="ticket-number">
                            <i class="far fa-receipt"></i>
                            <span id="currentTicketNumber">Ticket #000000001</span>
                        </div>
                    </div>

                    <!-- Badge mobile para total -->
                    <div class="mobile-totals-badge d-lg-none" id="mobileTotalBadge">
                        <span><i class="fas fa-shopping-cart"></i> Total carrito</span>
                        <strong id="mobileTotalSpan">$0.00</strong>
                    </div>

                    <div class="section-title">
                        <i class="fas fa-ticket-alt me-2"></i> Ticket de venta
                    </div>

                    <div class="item-list" id="itemList"></div>

                    <div class="totals">
                        <div class="line">
                            <span><i class="fas fa-calculator"></i> Sub-total</span>
                            <span id="cartSubtotal">$0.00</span>
                        </div>
                        <button class="btn btn-primary-action" type="button" id="payButtonMobileStyle">
                            <i class="fas fa-credit-card me-2"></i>
                            Pagar $0.00
                        </button>
                    </div>
                </div>

                <!-- COLUMNA PRODUCTOS / CATÁLOGO -->
                <aside class="side-right col-12 col-xl-8 col-lg-7">
                    <div class="search-box mb-3">
                        <div class="input-group shadow-sm rounded-pill overflow-hidden">
                            <span class="input-group-text bg-white border-0">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="search" id="searchInput" class="form-control border-0" placeholder="Buscar productos...">
                        </div>
                    </div>

                    <div class="categories" id="categoriesContainer"></div>
                    <div class="product-grid" id="productGrid"></div>
                </aside>
            </div>
        </div>

        <!-- MODAL PREVIEW PAGO -->
        <div id="paymentPreview" class="payment-preview d-none">
            <div class="preview-panel">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <i class="fas fa-receipt fa-2x mb-2 d-block"></i>
                        <h5 class="mb-0">Resumen de compra</h5>
                        <small class="text-muted">Revisa antes de pagar</small>
                    </div>
                    <button type="button" class="btn-close" id="previewCloseBtn"></button>
                </div>
                <div class="preview-items" id="previewItemsList"></div>
                <div class="preview-totals mt-3">
                    <div class="d-flex justify-content-between">
                        <span><i class="fas fa-calculator"></i> Sub-total</span>
                        <strong id="previewSubtotal">$0.00</strong>
                    </div>
                    <div class="d-flex justify-content-between total-line mt-2 pt-2">
                        <span><i class="fas fa-money-bill-wave"></i> Total</span>
                        <strong id="previewTotalAmount">$0.00</strong>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-secondary flex-fill" id="previewCancelBtn">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button class="btn btn-success flex-fill" id="previewConfirmBtn">
                        <i class="fas fa-check-circle"></i> Confirmar pago
                    </button>
                </div>
            </div>
        </div>

        <!-- MODAL HISTORIAL VENTAS -->
        <div id="historyPreview" class="payment-preview d-none">
            <div class="preview-panel">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <i class="fas fa-chart-line fa-2x mb-2 d-block"></i>
                        <h5 class="mb-0">Historial de ventas</h5>
                        <small class="text-muted">Últimos 7 días</small>
                    </div>
                    <button type="button" class="btn-close" id="historyCloseBtn"></button>
                </div>
                <div class="history-items" id="historyList"></div>
                <div class="mt-3 pt-2 border-top">
                    <div class="d-flex justify-content-between">
                        <span><i class="fas fa-receipt"></i> Ventas totales</span>
                        <strong id="historyCountSpan">0</strong>
                    </div>
                    <div class="d-flex justify-content-between mt-1">
                        <span><i class="fas fa-dollar-sign"></i> Monto recaudado</span>
                        <strong id="historyTotalSpan">$0.00</strong>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/ventas.js"></script>

    <br>
    <a href="index.html" class="btn-secundario">Volver al menú</a>
</body>

</html>
