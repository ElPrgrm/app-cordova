<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sistema de Ventas - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/form.css">
    <script type="text/javascript" src="cordova.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-dark text-white"
                    style="width:42px;height:42px;">
                    <i class="fas fa-cash-register"></i>
                </span>
                <span class="fw-bold text-dark">Sistema de Ventas</span>
            </a>
        </div>
    </nav>

    <main class="container py-3 ">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-secondary bg-opacity-10 text-secondary mb-3"
                                style="width:64px;height:64px;">
                                <i class="fas fa-boxes fa-lg"></i>
                            </div>
                            <h1 class="h3 mb-2">Registrar Producto</h1>
                            <p class="text-muted mb-0">Introduce los datos para actualizar el inventario global.</p>

                        </div>

                        <div id="formMessage" class="alert d-none" role="alert" aria-live="polite">
                            <div class="row">
                                <div class="col">
                                    <div id="messageAlert"></div>
                                </div>
                                <div id="buttons_alert" class="col d-none">
                                    <button id="action_alert" type="button" class="btn btn-primary"> </button>
                                    <button id="close_alert" type="button" class="btn btn-danger ">
                                        cerrar</button>
                                </div>
                            </div>
                        </div>





                        <form id="product-form" action="" method="post">
                            <div class="row row-cols-1 row-cols-md-2 g-3">
                                <div class="col">
                                    <label for="codeqr" class="form-label"><i
                                            class="fas fa-qrcode me-2"></i>Código</label>
                                    <input type="number" class="form-control" name="codeqr" id="codeqr"
                                        placeholder="xxxxxxxxxx" />
                                </div>
                                <div class="col">
                                    <label for="name" class="form-label"><i class="fas fa-tag me-2"></i>Nombre</label>
                                    <input type="text" class="form-control" name="name" id="name"
                                        placeholder="Ej. Refresco de Cola" />
                                </div>
                                <div class="col">
                                    <label for="description" class="form-label"><i
                                            class="fas fa-align-left me-2"></i>Descripción</label>
                                    <input type="text" class="form-control" name="description" id="description"
                                        placeholder="Detalles del producto" />
                                </div>
                                <div class="col">
                                    <label for="price" class="form-label"><i
                                            class="fas fa-dollar-sign me-2"></i>Precio</label>
                                    <input type="number" class="form-control" name="price" id="price" placeholder="0.00"
                                        step="0.01" />
                                </div>
                                <div class="col">
                                    <label for="quantity" class="form-label"><i
                                            class="fas fa-layer-group me-2"></i>Cantidad</label>
                                    <input type="number" class="form-control" name="quantity" id="quantity"
                                        placeholder="0" />
                                </div>
                            </div>
                            <div class="row g-3 mt-4">
                                <div class="col-12 col-sm-6">
                                    <button type="button" id="vlvr" name="vlvr" class="btn btn-outline-secondary w-100">
                                        <i class="fas fa-arrow-left me-2"></i>Volver
                                    </button>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <button type="submit" id="submitButton" class="btn btn-success w-100">
                                        <i class="fas fa-save me-2"></i>Guardar Producto
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/firebase.js"></script>
    <script src="js/form.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
