<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/form.css">

    <title>Formulario</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Formulario</h1>
                <p>Registra tu producto de forma rápida y clara.</p>
            </div>
            <div id="formMessage" class="form-message" aria-live="polite"></div>
            <form id="product-form" action="" method="post">

            <div class="mb-3">
                <label for="codeqr" class="form-label">Codigo</label>
                <input type="number" class="form-control" name="codeqr" id="codeqr" aria-describedby="helpId"
                    placeholder="xxxxxxxxxx" />
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" name="name" id="name" placeholder="Nombre" />
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">descripción</label>
                <input type="text" class="form-control" name="description" id="description" placeholder="descripción" />
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">precio</label>
                <input type="number" class="form-control" name="price" id="price" placeholder="xx.xx" />
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">cantidad</label>
                <input type="number" class="form-control" name="quantity" id="quantity" placeholder="xx" />
            </div>
            <div class="form-actions">
                <button type="submit">Guardar</button>
            </div>
            </form>
        </div>
    </div>
    <script src="cordova.js"></script>
    <script src="js/form.js"></script>
</body>

</html>
