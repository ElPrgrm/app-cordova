<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }

        .login-card {
            width: min(420px, 100%);
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
        }

        .form-footer {
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <main class="container py-4">
        <div class="card login-card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="brand-icon mb-3">
                        <i class="fas fa-user-lock fa-lg"></i>
                    </div>
                    <h1 class="h4 mb-1">Iniciar sesión</h1>
                    <p class="text-muted mb-0">Accede para administrar tu negocio.</p>
                </div>

                <div id="loginAlert" class="alert d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuarios</label>
                        <input id="username" name="username" type="text" class="form-control" required
                            autocomplete="username" placeholder="Nombre de usuario">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" name="password" type="password" class="form-control" required
                            autocomplete="current-password" placeholder="Contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <div class="text-center mt-4 form-footer text-muted">
                    ¿No tienes cuenta? <a href="register.html">Crear una cuenta nueva</a>
                </div>
            </div>
        </div>
    </main>
    <script src="js/firebase-core.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
